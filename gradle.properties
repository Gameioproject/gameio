# Heap budget. The previous values (5g + 6g) were sized for a 16 GB CI runner and
# over-commit a 15 GB WSL VM that also runs Docker, which sent compileDebugKotlin
# into swap. 4g + 5g leaves real headroom for KSP and the OS page cache.
# CI can override with -Dorg.gradle.jvmargs if it has more to spend.
org.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.workers.max=16

# Incremental compilation: without the classpath snapshot a change to one file
# recompiles the module, which is most of what makes a small edit expensive here.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ksp.incremental=true
ksp.useKSP2=false
