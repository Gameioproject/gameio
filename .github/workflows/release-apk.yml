name: Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of an existing GitHub release to attach the APKs to (optional)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Configure release signing
        env:
          GAMEIO_KEYSTORE_BASE64: ${{ secrets.GAMEIO_KEYSTORE_BASE64 }}
          GAMEIO_STORE_PASSWORD: ${{ secrets.GAMEIO_STORE_PASSWORD }}
          GAMEIO_KEY_PASSWORD: ${{ secrets.GAMEIO_KEY_PASSWORD }}
          GAMEIO_KEY_ALIAS: ${{ secrets.GAMEIO_KEY_ALIAS }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          required = ("GAMEIO_KEYSTORE_BASE64", "GAMEIO_STORE_PASSWORD", "GAMEIO_KEY_PASSWORD", "GAMEIO_KEY_ALIAS")
          if any(not os.environ.get(key) for key in required):
              raise SystemExit("Configure the Gameio release signing secrets before building a release.")
          keystore = Path(os.environ["RUNNER_TEMP"]) / "gameio-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ["GAMEIO_KEYSTORE_BASE64"], validate=True))
          keystore.chmod(0o600)
          values = {
              "storeFile": str(keystore),
              "storePassword": os.environ["GAMEIO_STORE_PASSWORD"],
              "keyAlias": os.environ["GAMEIO_KEY_ALIAS"],
              "keyPassword": os.environ["GAMEIO_KEY_PASSWORD"],
          }
          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace(" ", "\\ ")
          properties = Path("keystore.properties")
          properties.write_text("".join(key + "=" + escape(value) + "\n" for key, value in values.items()))
          properties.chmod(0o600)
          PYTHON

      - name: Build release APKs (arm64 + armv7 splits)
        run: ./gradlew :app:assembleRelease -PallAbis --no-daemon

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gameio-arm64
          path: app/build/outputs/apk/release/*arm64*.apk

      - name: Upload all release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gameio-all
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APKs to the GitHub release
        if: github.event_name == 'release' || inputs.release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/*.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the GitHub release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --title "Gameio ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
